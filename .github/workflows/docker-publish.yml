name: Publish Docker Image

on:
  # Started by the "Dispatch Docker image publish" job of release.yml on a release tag
  # (a workflow_run trigger on the release workflow never fired), or by hand.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + smoke-test the component pipeline without pushing (safe to run from a branch)."
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    # Publish plugin images only from a dispatch that targets a VERSION tag
    # (refs/tags/v*). The version-tag guard stops a branch / non-version-tag
    # dispatch from overwriting the mutable public plugin tags
    # (mysql8.0/8.4/9.7/latest). A dry_run dispatch builds and tests without pushing.
    if: >-
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # A plugin works only on the exact release it was built against, so each image
          # is based on mysql:<mysql-release>, the release of mysql-tag, and also tagged
          # with it (mysql<mysql-release>).
          - mysql-tag: 'mysql-8.0.46'
            mysql-release: '8.0.46'
            mysql-version: '8.0'
            dockerfile: Dockerfile.oraclelinux8
            compiler: 10
          - mysql-tag: 'mysql-8.4.13'
            mysql-release: '8.4.13'
            mysql-version: '8.4'
            dockerfile: Dockerfile.oraclelinux9
            compiler: 10
          - mysql-tag: 'mysql-9.7.4'
            mysql-release: '9.7.4'
            mysql-version: '9.7'
            dockerfile: Dockerfile.oraclelinux9
            compiler: 11
    steps:
      - name: Checkout MyVector Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Cache Boost
        uses: actions/cache@v4
        with:
          path: boost_cache
          key: boost-${{ matrix.mysql-tag }}-v2

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            gcc-10 \
            g++-10 \
            gcc-11 \
            g++-11 \
            libssl-dev \
            libncurses5-dev \
            pkg-config \
            bison \
            libtirpc-dev \
            libldap2-dev \
            libsasl2-dev \
            libudev-dev \
            libre2-dev \
            libcurl4-openssl-dev \
            libprotobuf-dev \
            protobuf-compiler

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build MyVector plugin (amd64/arm64)
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            build_dir="mysql-server-${arch}"
            docker run --rm --platform "linux/${arch}" \
              -v "$PWD":/work -w /work ubuntu:22.04 bash -lc "
                set -euo pipefail
                # apt-get install under QEMU-emulated linux/arm64 has been observed to
                # crash mid-postinst (libc-bin's postinst segfaulting under binfmt_misc
                # emulation) -- a QEMU/binfmt flake, not a package or code problem; the
                # same install succeeds on a bare re-run against the same packages. See
                # myvector#138. Retry a few times before giving up so a transient
                # emulator crash doesn't fail the whole release publish.
                apt_ok=0
                for attempt in 1 2 3; do
                  if apt-get update && apt-get install -y \
                    build-essential \
                    cmake \
                    gcc-${{ matrix.compiler }} \
                    g++-${{ matrix.compiler }} \
                    git \
                    libssl-dev \
                    libncurses5-dev \
                    pkg-config \
                    bison \
                    libtirpc-dev \
                    libldap2-dev \
                    libsasl2-dev \
                    libudev-dev \
                    libre2-dev \
                    libcurl4-openssl-dev \
                    libprotobuf-dev \
                    protobuf-compiler; then
                    apt_ok=1
                    break
                  fi
                  echo \"apt-get install failed (attempt \$attempt/3) on emulated linux/${arch} -- known QEMU/binfmt flake, myvector#138; retrying in 5s...\" >&2
                  sleep 5
                done
                [ \"\$apt_ok\" = 1 ] || { echo \"apt-get install failed after 3 attempts on linux/${arch} (myvector#138)\" >&2; exit 1; }
                rm -rf ${build_dir}
                git clone --depth 1 --branch ${{ matrix.mysql-tag }} \
                  https://github.com/mysql/mysql-server.git ${build_dir}
                mkdir -p /work/boost_cache
                mkdir -p ${build_dir}/plugin/myvector
                cp src/*.cc ${build_dir}/plugin/myvector/
                cp include/*.h ${build_dir}/plugin/myvector/
                cp include/*.i ${build_dir}/plugin/myvector/ 2>/dev/null || true
                cp CMakeLists.txt ${build_dir}/plugin/myvector/
                cd ${build_dir}
                mkdir -p bld && cd bld
                cmake .. \
                  -DCMAKE_C_COMPILER=gcc-${{ matrix.compiler }} \
                  -DCMAKE_CXX_COMPILER=g++-${{ matrix.compiler }} \
                  -DDOWNLOAD_BOOST=1 \
                  -DWITH_BOOST=/work/boost_cache \
                  -DWITH_UNIT_TESTS=OFF \
                  -DWITH_ROUTER=OFF \
                  -DWITH_RAPID=OFF \
                  -DWITH_NDB=OFF \
                  -DWITH_NDBCLUSTER=OFF \
                  -DWITH_EXAMPLE_STORAGE_ENGINE=OFF \
                  -DCMAKE_BUILD_TYPE=Release
                make myvector -j\$(nproc)
                cp plugin_output_directory/myvector.so /work/myvector-${arch}.so
              "
          done
          cp sql/myvectorplugin.sql .

      - name: Restore boost_cache ownership for cache action
        run: |
          if [ -d boost_cache ]; then
            sudo chown -R "$(id -u):$(id -g)" boost_cache
          fi

      - name: Smoke test image contents
        run: |
          for arch in amd64 arm64; do
            docker buildx build \
              --platform "linux/${arch}" \
              --file ${{ matrix.dockerfile }} \
              --build-arg MYSQL_VERSION=${{ matrix.mysql-release }} \
              -t "myvector-smoke:${{ matrix.mysql-version }}-${arch}" \
              --load \
              .
            docker run --rm --platform "linux/${arch}" \
              "myvector-smoke:${{ matrix.mysql-version }}-${arch}" \
              /bin/sh -c "test -f /usr/lib/mysql/plugin/myvector.so && test -f /docker-entrypoint-initdb.d/myvectorplugin.sql"
          done

      - name: Smoke test README examples
        run: |
          for arch in amd64 arm64; do
            DOCKER_DEFAULT_PLATFORM="linux/${arch}" \
              bash scripts/smoke-readme.sh "myvector-smoke:${{ matrix.mysql-version }}-${arch}"
          done

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          # Never push on a dry_run dispatch — build only, to prove the pipeline.
          push: ${{ !inputs.dry_run }}
          tags: |
            ghcr.io/${{ github.repository }}:mysql${{ matrix.mysql-version }}
            ghcr.io/${{ github.repository }}:mysql${{ matrix.mysql-release }}
          build-args: |
            MYSQL_VERSION=${{ matrix.mysql-release }}

      - name: Tag and push latest
        if: matrix.mysql-version == '8.0'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ !inputs.dry_run }}
          tags: ghcr.io/${{ github.repository }}:latest
          build-args: |
            MYSQL_VERSION=${{ matrix.mysql-release }}

  # Component-based images (INSTALL COMPONENT), distinct from the legacy plugin
  # images built above. mysql8.4/mysql9.7 already ship as plugin images with
  # existing users depending on them, so component images for those versions get
  # a "-component" tag suffix; mysql26.10 has no plugin equivalent to collide with
  # (component-only), so it gets the plain tag.
  # The same job also builds component_mcp_guard and publishes the separate mysql-mcp
  # image family (docker/mysql-mcp/Dockerfile, RFC 0001 in askdba/mysql-mcp-server) as
  # ghcr.io/<owner>/mysql-mcp:<mysql-version>.
  build-and-publish-component:
    # Publish only from a dispatch that targets a VERSION tag (refs/tags/v*).
    # Without the version-tag guard, a workflow_dispatch off any branch — or any non-version tag — would
    # push that ref's build to the mutable public component tags
    # (mysql8.4-component / mysql9.7-component / mysql26.10).
    if: >-
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # A component works only on the exact release it was built against (a build for
          # 8.4.8 crashed 8.4.11 in askdba/myvector#244), so each image is based on
          # mysql:<mysql-release>, the release of mysql-tag, and also tagged with it.
          - mysql-tag: 'mysql-8.4.13'
            mysql-release: '8.4.13'
            mysql-version: '8.4'
            build-script: scripts/build-component-8.4-docker.sh
            image-tag: 'mysql8.4-component'
            release-image-tag: 'mysql8.4.13-component'
          - mysql-tag: 'mysql-9.7.4'
            mysql-release: '9.7.4'
            mysql-version: '9.7'
            build-script: scripts/build-component-9.7-docker.sh
            image-tag: 'mysql9.7-component'
            release-image-tag: 'mysql9.7.4-component'
          - mysql-tag: 'mysql-26.10.0'
            mysql-release: '26.10.0'
            mysql-version: '26.10'
            build-script: scripts/build-component-26.10-docker.sh
            image-tag: 'mysql26.10'
            release-image-tag: 'mysql26.10.0'
    steps:
      - name: Checkout MyVector Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build MyVector component (amd64/arm64)
        env:
          MYVECTOR_BUILD_MCP: "ON"
        run: |
          set -euo pipefail
          chmod +x ${{ matrix.build-script }}
          for arch in amd64 arm64; do
            platform="linux/${arch}"
            DOCKER_PLATFORM="$platform" ${{ matrix.build-script }} \
              "${{ matrix.mysql-tag }}" "build/component-${arch}"
          done
          # .dockerignore excludes build*/, so stage artifacts at the repo root.
          cp build/component-amd64/libmyvector_component.so myvector-component-amd64.so
          cp build/component-arm64/libmyvector_component.so myvector-component-arm64.so
          cp build/component-amd64/myvector.json myvector.json
          cp build/component-amd64/component_mcp_guard.so component_mcp_guard-amd64.so
          cp build/component-arm64/component_mcp_guard.so component_mcp_guard-arm64.so
          cp sql/myvector_install_component.sql myvector_install_component.sql
          cp sql/myvector_uninstall_component.sql myvector_uninstall_component.sql

      - name: Smoke test component artifact
        run: |
          chmod +x scripts/smoke-component.sh
          COMPONENT_DIR=build/component-amd64 ./scripts/smoke-component.sh "${{ matrix.mysql-release }}"

      - name: Smoke test image contents
        run: |
          for arch in amd64 arm64; do
            docker buildx build \
              --platform "linux/${arch}" \
              --file Dockerfile.component \
              --build-arg MYSQL_VERSION=${{ matrix.mysql-release }} \
              -t "myvector-component-smoke:${{ matrix.mysql-version }}-${arch}" \
              --load \
              .
            docker run --rm --platform "linux/${arch}" \
              "myvector-component-smoke:${{ matrix.mysql-version }}-${arch}" \
              /bin/sh -c "test -f /usr/lib/mysql/plugin/myvector.so && test -f /usr/lib/mysql/plugin/myvector.json && test -f /docker-entrypoint-initdb.d/myvector_install_component.sql && test -f /usr/share/myvector/myvector_uninstall_component.sql"
          done

      - name: Smoke test README examples
        run: |
          for arch in amd64 arm64; do
            DOCKER_DEFAULT_PLATFORM="linux/${arch}" \
              bash scripts/smoke-readme.sh "myvector-component-smoke:${{ matrix.mysql-version }}-${arch}"
          done

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.component
          platforms: linux/amd64,linux/arm64
          # Never push on a dry_run dispatch — build only, to prove the pipeline.
          push: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ matrix.image-tag }}
            ghcr.io/${{ github.repository }}:${{ matrix.release-image-tag }}
          build-args: |
            MYSQL_VERSION=${{ matrix.mysql-release }}

      # Like the component image, the mysql-mcp image is based on the exact release the
      # guard was built against (mysql-release).
      - name: Test mysql-mcp image
        env:
          MYSQL_VERSION: ${{ matrix.mysql-release }}
        run: |
          for arch in amd64 arm64; do
            docker buildx build \
              --platform "linux/${arch}" \
              --file docker/mysql-mcp/Dockerfile \
              --build-arg MYSQL_VERSION="$MYSQL_VERSION" \
              -t "mysql-mcp-smoke:${MYSQL_VERSION}-${arch}" \
              --load \
              .
          done
          # Full first-start test natively; arm64 under QEMU checks the contents only.
          chmod +x scripts/test-mysql-mcp-image.sh
          scripts/test-mysql-mcp-image.sh "mysql-mcp-smoke:${MYSQL_VERSION}-amd64"
          docker run --rm --platform linux/arm64 --entrypoint /bin/sh "mysql-mcp-smoke:${MYSQL_VERSION}-arm64" -c \
            "test -f /usr/lib64/mysql/plugin/component_mcp_guard.so && test -f /usr/share/mysql-mcp/mysql_mcp.sql && test -f /docker-entrypoint-initdb.d/50-mysql-mcp.sh"

      - name: Build and push mysql-mcp image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/mysql-mcp/Dockerfile
          platforms: linux/amd64,linux/arm64
          # Never push on a dry_run dispatch — build only, to prove the pipeline.
          push: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/mysql-mcp:${{ matrix.mysql-version }}
            ghcr.io/${{ github.repository_owner }}/mysql-mcp:${{ matrix.mysql-release }}
          build-args: |
            MYSQL_VERSION=${{ matrix.mysql-release }}
