---
name: Release MyVector (Plugin + Component)

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions: read-all

jobs:
  # Plugin build (in-tree). Requires a plugin CMakeLists.txt when copied into server tree.
  build-and-release:
    name: Build Plugin (in-tree)
    runs-on: ${{ matrix.os }}
    continue-on-error: true  # in-tree build uses MYSQL_ADD_PLUGIN path; keep non-blocking until CI validates
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            mysql-version: '8.0.35'
          - os: ubuntu-latest
            mysql-version: '8.4.8'
          - os: ubuntu-latest
            mysql-version: '9.0.0'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build release artifact
        run: |
          mkdir -p release
          ./scripts/build-release.sh ${{ matrix.mysql-version }} release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: myvector-mysql${{ matrix.mysql-version }}-${{ runner.os }}-${{ runner.arch }}
          path: release/*.tar.gz

  # Component build (out-of-tree, MYSQL_SOURCE_DIR). Mirrors plugin release flow.
  build-and-release-component:
    name: Build Component (out-of-tree)
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.continue-on-error || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - mysql-version: '8.4.8'
            mysql-tag: 'mysql-8.4.8'
          - mysql-version: '9.7.0'
            mysql-tag: 'mysql-9.7.0'
            continue-on-error: true
          # 26.7 (Innovation) is validated in CI (build-component-26-7 /
          # test-component-26-7) but intentionally kept OUT of the release
          # matrix until its component build is proven end-to-end. Adding it
          # here (even with continue-on-error) would let create-release publish
          # a GitHub Release with no usable 26.7 archive. Re-add once proven.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libmysqlclient-dev pkg-config

      - name: Cache MySQL source
        id: cache-mysql
        if: matrix.mysql-version != '9.7.0'
        uses: actions/cache@v4
        with:
          path: mysql-server
          key: release-mysql-${{ matrix.mysql-tag }}-v1

      - name: Clone MySQL source
        if: matrix.mysql-version != '9.7.0' && steps.cache-mysql.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch ${{ matrix.mysql-tag }} \
            https://github.com/mysql/mysql-server.git mysql-server

      - name: Build component
        run: |
          case "${{ matrix.mysql-version }}" in
            9.7.0)  ./scripts/build-component-9.7-docker.sh  "${{ matrix.mysql-tag }}" ;;
            *)      ./scripts/build-component.sh "${{ matrix.mysql-tag }}" "$(pwd)/mysql-server" ;;
          esac

      - name: Package component artifact
        run: |
          mkdir -p release
          case "$(uname -m)" in
            x86_64) ARCH=amd64 ;;
            aarch64) ARCH=arm64 ;;
            *) ARCH=$(uname -m) ;;
          esac
          ARTIFACT_NAME="myvector-component-mysql${{ matrix.mysql-version }}-linux-${ARCH}"
          PACK_DIR="release/${ARTIFACT_NAME}"
          mkdir -p "$PACK_DIR"
          # Ship both names: myvector.so is the deployed plugin-dir filename
          # (used by the install docs / Docker image), while
          # libmyvector_component.so is what scripts/myvectorbench.py's
          # _resolve_artifact_dir expects at the archive root.
          cp build/component/libmyvector_component.so "$PACK_DIR/myvector.so"
          cp build/component/libmyvector_component.so "$PACK_DIR/libmyvector_component.so"
          cp build/component/myvector.json "$PACK_DIR/"
          # installed via INSTALL COMPONENT). Bundle the component install/uninstall
          # scripts, NOT myvectorplugin.sql — that script's first statement is
          # INSTALL PLUGIN, which cannot load a component and would leave the
          # artifact unusable.
          for sql_file in myvector_install_component.sql myvector_uninstall_component.sql; do
            if [ -f "sql/${sql_file}" ]; then
              cp "sql/${sql_file}" "$PACK_DIR/" || { echo "Error: failed to copy sql/${sql_file} (check permissions/disk)"; exit 1; }
            else
              echo "Error: sql/${sql_file} missing, cannot package a usable component artifact"; exit 1
            fi
          done
          tar -czf "release/${ARTIFACT_NAME}.tar.gz" -C release "$ARTIFACT_NAME"
          echo "Created release/${ARTIFACT_NAME}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: myvector-component-mysql${{ matrix.mysql-version }}-${{ runner.os }}-${{ runner.arch }}
          path: release/*.tar.gz

  # Wait for both jobs; release uses component artifacts only. Plugin has continue-on-error
  # so it does not block release when plugin build is disabled or failing.
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-release, build-and-release-component]
    permissions:
      contents: write
    steps:
      - name: Download component artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'myvector-component-*'
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          # upload-artifact with path: release/*.tar.gz preserves release/ subdir
          # in each artifact; use find to handle both flat and nested layouts
          find . -type f -name '*.tar.gz' -exec sha256sum {} \; > checksums.txt
          if [ ! -s checksums.txt ]; then
            echo "No .tar.gz files found in artifacts"
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/checksums.txt
          generate_release_notes: true