---
# Integration test scripts that run against official mysql:<ver> Docker images:
#   scripts/test-filtered-ann.py        filtered ANN search, key-list form (#157)
#   scripts/test-filtered-ann-broad.py  MYVECTOR_ANN_FILTERED for broad filters (#164)
#   scripts/test-ef-search.py           ef_search applies per query (#165)
#   scripts/test-online-updates-idle.py online=Y updates survive idle, rotation,
#                                       KILL of the binlog connection (#166, #179)
#   scripts/test-online-dml.py          online DELETE/UPDATE (#188, #194), INT and
#                                       BIGINT keys (#204), skip warnings (#205)
#   scripts/test-distance-udf.py        myvector_distance NULL/errors (#170, #171)
#   scripts/test-crash-regressions.py   malformed MYVECTOR_IS_ANN and a NULL
#                                       vector row during index build no
#                                       longer crash mysqld (audit run-1)
#   scripts/test-index-governance.py    access-control bypass, SQL injection and
#                                       path traversal in index build/governance
#                                       are closed, ordinary workflow unaffected
#                                       (audit run-1)
#   scripts/test-udf-input-validation.py  myvector_construct/_bv stack and heap
#                                       overflows, an undersized myvector_ann_set
#                                       query vector, and an undersized vector
#                                       reaching insertVector() via binlog apply,
#                                       bulk build or add-row are all rejected
#                                       cleanly instead of read/written OOB
#                                       (audit run-1)
#   scripts/test-hnsw-loader-hardening.py  a corrupted/crafted .hnsw.index or
#                                       .hnsw.index.links file is rejected
#                                       cleanly on load instead of corrupting
#                                       memory, ordinary load/save unaffected
#                                       (audit run-1)
#   scripts/test-ef-search-clamp.py     a huge ef_search value doesn't blow past
#                                       a bounded search-effort ceiling, ordinary
#                                       ef_search behavior unaffected (audit run-1)
# Artifacts are built with the Docker build scripts (Oracle Linux 9, like the
# mysql images), so they load in the containers; the ci.yml builds are made on
# the Ubuntu runner and target the runner's own MySQL instead.
# Blocking, unlike the non-blocking pre-release gate.
name: Integration scripts

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "include/**"
      - "sql/**"
      - "scripts/test-*.py"
      - "scripts/test-mcp-guard.sh"
      - "scripts/test-mcp-tool-pack.sh"
      - "scripts/test-mysql-mcp-image.sh"
      - "docker/mysql-mcp/**"
      - "scripts/build-component*"
      - "scripts/build-plugin*"
      - "CMakeLists.txt"
      - ".github/workflows/integration-scripts.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "include/**"
      - "sql/**"
      - "scripts/test-*.py"
      - "scripts/test-mcp-guard.sh"
      - "scripts/test-mcp-tool-pack.sh"
      - "scripts/test-mysql-mcp-image.sh"
      - "docker/mysql-mcp/**"
      - "scripts/build-component*"
      - "scripts/build-plugin*"
      - "CMakeLists.txt"
      - ".github/workflows/integration-scripts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: scripts (${{ matrix.kind }} ${{ matrix.mysql-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: plugin
            mysql-version: "8.4"
            mysql-tag: "mysql-8.4.8"
            build-script: "scripts/build-plugin-8.4-docker.sh"
          - kind: component
            mysql-version: "8.4"
            mysql-tag: "mysql-8.4.8"
            build-script: "scripts/build-component-8.4-docker.sh"
          - kind: component
            mysql-version: "9.7"
            mysql-tag: "mysql-9.7.0"
            build-script: "scripts/build-component-9.7-docker.sh"
          - kind: component
            mysql-version: "26.10"
            mysql-tag: "mysql-26.10.0"
            build-script: "scripts/build-component-26.10-docker.sh"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build ${{ matrix.kind }}
        env:
          BUILD_SCRIPT: ${{ matrix.build-script }}
          MYSQL_TAG: ${{ matrix.mysql-tag }}
          OUT_DIR: dist/${{ matrix.kind }}-${{ matrix.mysql-version }}
        run: |
          chmod +x "$BUILD_SCRIPT"
          "$BUILD_SCRIPT" "$MYSQL_TAG" "$OUT_DIR"
          ls -la "$OUT_DIR"

      - name: Run test scripts
        env:
          KIND: ${{ matrix.kind }}
          MYSQL_VERSION: ${{ matrix.mysql-version }}
        run: |
          DIR="dist/${KIND}-${MYSQL_VERSION}"
          ARGS=("--${KIND}-dir" "$DIR" --image "mysql:${MYSQL_VERSION}")
          failed=()
          # Each entry: a script and its extra arguments.
          for t in "test-filtered-ann.py" "test-filtered-ann-broad.py" \
                   "test-ef-search.py" "test-online-updates-idle.py" \
                   "test-online-dml.py" "test-online-dml.py --key-type bigint" \
                   "test-distance-udf.py" "test-crash-regressions.py" \
                   "test-index-governance.py" "test-udf-input-validation.py" \
                   "test-hnsw-loader-hardening.py" "test-ef-search-clamp.py"; do
            read -r -a T <<< "$t"
            echo "::group::${t} (${KIND} ${MYSQL_VERSION})"
            if python3 "scripts/${T[0]}" "${ARGS[@]}" "${T[@]:1}"; then
              echo "PASS: ${t}"
            else
              echo "::error::${t} failed (${KIND} ${MYSQL_VERSION})"
              failed+=("$t")
            fi
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "Failed: ${failed[*]}"
            exit 1
          fi
          echo "All test scripts passed (${KIND} ${MYSQL_VERSION})"

  mcp-guard:
    # component_mcp_guard (RFC 0001 in askdba/mysql-mcp-server): unit-test the policy,
    # build it with MYVECTOR_BUILD_MCP=ON and run the lifecycle and enforcement test
    # (scripts/test-mcp-guard.sh) on the official image of the same patch release.
    name: mcp-guard (${{ matrix.mysql-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - mysql-version: "8.4.11"
            mysql-tag: "mysql-8.4.11"
            build-script: "scripts/build-component-8.4-docker.sh"
          - mysql-version: "9.7.2"
            mysql-tag: "mysql-9.7.2"
            build-script: "scripts/build-component-9.7-docker.sh"
          - mysql-version: "26.10.0"
            mysql-tag: "mysql-26.10.0"
            build-script: "scripts/build-component-26.10-docker.sh"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Policy unit test
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -o /tmp/test_mcp_guard_policy src/mcp/guard/test_mcp_guard_policy.cc
          /tmp/test_mcp_guard_policy

      - name: Build component_mcp_guard
        env:
          BUILD_SCRIPT: ${{ matrix.build-script }}
          MYSQL_TAG: ${{ matrix.mysql-tag }}
          MYVECTOR_BUILD_MCP: "ON"
          OUT_DIR: dist/mcp-guard-${{ matrix.mysql-version }}
        run: |
          chmod +x "$BUILD_SCRIPT"
          "$BUILD_SCRIPT" "$MYSQL_TAG" "$OUT_DIR"
          ls -la "$OUT_DIR"
          test -f "$OUT_DIR/component_mcp_guard.so"

      - name: Lifecycle test
        env:
          MYSQL_VERSION: ${{ matrix.mysql-version }}
        run: |
          chmod +x scripts/test-mcp-guard.sh
          scripts/test-mcp-guard.sh "$MYSQL_VERSION" "dist/mcp-guard-${MYSQL_VERSION}"

      - name: mysql-mcp image test
        # The image docker-publish.yml publishes as ghcr.io/<owner>/mysql-mcp, built on the
        # official image of the same patch release.
        env:
          MYSQL_VERSION: ${{ matrix.mysql-version }}
        run: |
          cp "dist/mcp-guard-${MYSQL_VERSION}/component_mcp_guard.so" component_mcp_guard-amd64.so
          docker build -f docker/mysql-mcp/Dockerfile --build-arg MYSQL_VERSION="$MYSQL_VERSION" \
            --build-arg TARGETARCH=amd64 -t "mysql-mcp-smoke:$MYSQL_VERSION" .
          chmod +x scripts/test-mysql-mcp-image.sh
          scripts/test-mysql-mcp-image.sh "mysql-mcp-smoke:$MYSQL_VERSION"

  mcp-tool-pack:
    # The mysql_mcp SQL tool pack (sql/mcp/, RFC 0001 Phase 1 in askdba/mysql-mcp-server):
    # install, re-install, and parity of every procedure with mysql-mcp-server's own query,
    # as root and as an EXECUTE-only MCP account. Plain SQL, so no build step.
    name: mcp-tool-pack (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ["mysql:8.0", "mysql:8.4", "mysql:9.7", "mysql:26.10", "mariadb:11.4", "mariadb:12.3"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Tool pack test
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          chmod +x scripts/test-mcp-tool-pack.sh
          scripts/test-mcp-tool-pack.sh "$IMAGE"
