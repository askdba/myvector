# ef_search recall/throughput sweep on a real dataset (myvector#131).
# Not used by CI; run by hand, results in docs/EF_SEARCH_SWEEP.md:
#
#   python3 scripts/myvectorbench.py --config myvectorbench-glove.yml \
#       --mysql-version 8.4 --build-path plugin --artifact-dir dist/plugin-8.4 \
#       --image ghcr.io/askdba/myvector:mysql8.4 --output glove-sweep.json
#
# The published numbers are from the plugin. Component builds have had
# MYVECTOR_IS_ANN since #156 (not in v1.26.9), but aren't measured here.
matrix:
  cells:
    - mysql: "8.4"
      build: plugin
      image: "ghcr.io/askdba/myvector:mysql8.4"

workload:
  dataset: glove50          # GloVe 6B 50d, downloaded to ~/.cache/myvectorbench/
  rows: 100000              # indexed rows; the held-out queries come on top
  dim: 50
  distance: Cosine          # GloVe is benchmarked as angular (ann-benchmarks glove-*-angular)
  holdout_queries: 1000     # query vectors kept out of the index: no self-matches
  M: 16
  ef_construction: 200
  knn_queries: 200
  knn_ann_queries: 200
  recall_queries: 1000
  ef_search_sweep: [10, 20, 50, 100, 200, 400]
  ef_search_sweep_queries: 1000
