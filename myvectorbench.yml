matrix:
  cells:
    - mysql: "8.4"
      build: plugin
      image: "ghcr.io/askdba/myvector:mysql8.4"
    - mysql: "8.4"
      build: component
      image: "mysql:8.4"
      artifact: "component-8.4"
    - mysql: "9.7"
      build: component
      image: "mysql:9.7"
      artifact: "component-9.7"

workload:
  dataset: synthetic        # synthetic | glove50 | glove300 | /path/to/custom.tsv
  rows: 10000
  dim: 128
  M: 16
  ef_construction: 200
  knn_queries: 200
  knn_ann_queries: 200
  recall_queries: 50

thresholds:
  index_build_time_s: +25%
  insert_qps: -25%
  knn_qps: -25%
  knn_p99_ms: +30%
  recall_at_10: -0.05   # absolute delta
  knn_ann_qps: -25%
  knn_ann_p50_ms: +30%
  knn_ann_p99_ms: +30%
